name: Benchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btree-pool-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pool:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build nasm
          git submodule update --init third-party/fmt
          git clone --no-checkout https://github.com/abseil/abseil-cpp.git "$RUNNER_TEMP/pool-absl"
          git -C "$RUNNER_TEMP/pool-absl" checkout 2a2d6aad626f75a32c8b7bb775fbff73d558b8b1
      - name: Bounded GCC and Clang measurement
        shell: bash
        run: |
          mkdir pool-evidence
          lscpu > pool-evidence/cpu.txt
          uname -a > pool-evidence/os.txt
          git rev-parse HEAD > pool-evidence/source.txt
          sha256sum benchmarks/src/btree_pool_probe.cpp benchmarks/src/btree_focused.hpp include/wjr/container/btree.hpp > pool-evidence/sources.sha256
          for tool in gcc clang; do
            if [[ "$tool" == gcc ]]; then cc=gcc; cxx=g++; else cc=clang; cxx=clang++; fi
            "$cxx" --version > "pool-evidence/$tool-version.txt"
            cmake -S . -B "build-$tool" -GNinja \
              -DCMAKE_BUILD_TYPE=Release -DWJR_CXX_STANDARD=20 -DWJR_CPU_TARGET=baseline \
              -DWJR_BUILD_BENCHMARKS=ON -DWJR_BENCHMARK_PROFILE=btree \
              -DWJR_BENCHMARK_ABSEIL=ON -DWJR_BENCHMARK_ABSEIL_SOURCE_DIR="$RUNNER_TEMP/pool-absl" \
              -DWJR_BUILD_TESTS=OFF -DWJR_ENABLE_INSTALL=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_COMPILER="$cc" -DCMAKE_CXX_COMPILER="$cxx" \
              -DFETCHCONTENT_BASE_DIR="$RUNNER_TEMP/pool-fetch-$tool"
            cmake --build "build-$tool" --target btree_pool btree_pool_memory --parallel 4
            "./build-$tool/bin/btree_pool_memory" > "pool-evidence/$tool-memory.csv"
            "./build-$tool/bin/btree_pool" --benchmark_min_time=0.03s \
              --benchmark_report_aggregates_only=false --benchmark_out="pool-evidence/$tool-timing.json" \
              > "pool-evidence/$tool-timing.txt" 2>&1
            cp "build-$tool/compile_commands.json" "pool-evidence/$tool-compile-commands.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btree-pool
          path: pool-evidence/
          retention-days: 30
