name: NP operation dispatch code generation

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Bounded research profile
        required: true
        default: np
        type: choice
        options:
          - np
      after:
        description: Frozen refactor commit SHA
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: np-operation-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code generation probe
        uses: actions/checkout@v5

      - name: Compare installed GCC and Clang before and after
        env:
          AFTER_SHA: ${{ inputs.after }}
        run: python3 benchmarks/research/operation_dispatch.py "$AFTER_SHA"

      - name: Upload assembly, normalized sequences and differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: np-operation-dispatch-${{ github.sha }}
          path: |
            build/operation-dispatch/*.json
            build/operation-dispatch/*.txt
            build/operation-dispatch/*.log
            build/operation-dispatch/*.s
            build/operation-dispatch/*.cpp
          retention-days: 30
