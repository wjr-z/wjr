name: Benchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btree-recursive-copy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  copy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies and exact reference engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build nasm libgtest-dev
          git submodule update --init third-party/fmt
          git fetch --depth=1 origin 0a58a4d3ab90998499fbf9f37cd36e293ef02614 ce72ba29d2da16d4daccd67533f0db8a15db874e
          mkdir -p "$RUNNER_TEMP/copy-main/wjr/container" "$RUNNER_TEMP/copy-prior/wjr/container"
          git show 0a58a4d3ab90998499fbf9f37cd36e293ef02614:include/wjr/container/btree.hpp > "$RUNNER_TEMP/copy-main/wjr/container/btree.hpp"
          git show ce72ba29d2da16d4daccd67533f0db8a15db874e:include/wjr/container/btree.hpp > "$RUNNER_TEMP/copy-prior/wjr/container/btree.hpp"
      - name: Same-worker GCC and Clang bounded three-engine copy
        shell: bash
        run: |
          mkdir copy-evidence
          lscpu > copy-evidence/cpu.txt
          uname -a > copy-evidence/os.txt
          git rev-parse HEAD > copy-evidence/source.txt
          sha256sum include/wjr/container/btree.hpp benchmarks/src/btree_copy.cpp test/container/btree_copy_reuse.cpp "$RUNNER_TEMP/copy-main/wjr/container/btree.hpp" "$RUNNER_TEMP/copy-prior/wjr/container/btree.hpp" > copy-evidence/sources.sha256
          for tool in gcc clang; do
            if [[ "$tool" == gcc ]]; then cc=gcc; cxx=g++; else cc=clang; cxx=clang++; fi
            "$cxx" --version > "copy-evidence/$tool-version.txt"
            cmake -S . -B "build-$tool" -GNinja \
              -DCMAKE_BUILD_TYPE=Release -DWJR_CXX_STANDARD=20 -DWJR_CPU_TARGET=baseline \
              -DWJR_BUILD_BENCHMARKS=ON -DWJR_BENCHMARK_PROFILE=btree -DWJR_BENCHMARK_ABSEIL=OFF \
              -DWJR_COPY_MAIN_INCLUDE="$RUNNER_TEMP/copy-main" -DWJR_COPY_PRIOR_INCLUDE="$RUNNER_TEMP/copy-prior" \
              -DWJR_BUILD_TESTS=OFF -DWJR_ENABLE_INSTALL=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_COMPILER="$cc" -DCMAKE_CXX_COMPILER="$cxx" \
              -DFETCHCONTENT_BASE_DIR="$RUNNER_TEMP/recursive-copy-$tool"
            cmake --build "build-$tool" --target btree_copy btree_copy_memory btree_copy_main btree_copy_prior btree_copy_main_memory btree_copy_prior_memory --parallel 4
            for version in main prior candidate; do
              if [[ "$version" == candidate ]]; then target=btree_copy_memory; else target=btree_copy_${version}_memory; fi
              "./build-$tool/bin/$target" > "copy-evidence/$tool-$version-memory.csv"
            done
            index=0
            for version in main prior candidate candidate prior main; do
              if [[ "$version" == candidate ]]; then target=btree_copy; else target=btree_copy_${version}; fi
              "./build-$tool/bin/$target" --benchmark_filter='/legacy/' --benchmark_min_time=0.005s \
                --benchmark_report_aggregates_only=false --benchmark_out="copy-evidence/$tool-$index-$version.json" \
                > "copy-evidence/$tool-$index-$version.txt" 2>&1
              index=$((index+1))
            done
            cp "build-$tool/compile_commands.json" "copy-evidence/$tool-compile-commands.json"
          done
      - name: Complete node ownership, SSO and allocator hooks
        run: |
          clang++ -std=c++20 -O1 -g -DNDEBUG -DWJR_DEBUG_LEVEL=0 -DFMT_HEADER_ONLY \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Iinclude -Ithird-party/fmt/include -I/usr/src/googletest/googletest/include \
            -I/usr/src/googletest/googletest test/container/btree_copy_reuse.cpp \
            test/container/btree_assignment.cpp /usr/src/googletest/googletest/src/gtest-all.cc \
            /usr/src/googletest/googletest/src/gtest_main.cc -pthread -o copy-evidence/asan
          ./copy-evidence/asan > copy-evidence/asan-tests.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btree-recursive-copy
          path: copy-evidence/
          retention-days: 30
