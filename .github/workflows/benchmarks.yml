name: Benchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btree-packed-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build nasm libgtest-dev
          git submodule update --init third-party/fmt
          git clone --no-checkout https://github.com/abseil/abseil-cpp.git "$RUNNER_TEMP/bulk-absl"
          git -C "$RUNNER_TEMP/bulk-absl" checkout 2a2d6aad626f75a32c8b7bb775fbff73d558b8b1
      - name: GCC and Clang bounded measurement
        shell: bash
        run: |
          mkdir bulk-evidence
          lscpu > bulk-evidence/cpu.txt
          uname -a > bulk-evidence/os.txt
          git rev-parse HEAD > bulk-evidence/source.txt
          sha256sum benchmarks/src/btree_bulk_build.cpp include/wjr/container/btree.hpp include/wjr/container/experimental/btree_bulk.hpp test/container/btree_bulk.cpp > bulk-evidence/sources.sha256
          for tool in gcc clang; do
            if [[ "$tool" == gcc ]]; then cc=gcc; cxx=g++; else cc=clang; cxx=clang++; fi
            "$cxx" --version > "bulk-evidence/$tool-version.txt"
            cmake -S . -B "build-$tool" -GNinja \
              -DCMAKE_BUILD_TYPE=Release -DWJR_CXX_STANDARD=20 -DWJR_CPU_TARGET=baseline \
              -DWJR_BUILD_BENCHMARKS=ON -DWJR_BENCHMARK_PROFILE=btree \
              -DWJR_BENCHMARK_ABSEIL=ON -DWJR_BENCHMARK_ABSEIL_SOURCE_DIR="$RUNNER_TEMP/bulk-absl" \
              -DWJR_BUILD_TESTS=OFF -DWJR_ENABLE_INSTALL=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_COMPILER="$cc" -DCMAKE_CXX_COMPILER="$cxx" \
              -DFETCHCONTENT_BASE_DIR="$RUNNER_TEMP/bulk-fetch-$tool"
            cmake --build "build-$tool" --target btree_bulk_build btree_bulk_memory --parallel 4
            "./build-$tool/bin/btree_bulk_build" --benchmark_report_aggregates_only=false \
              --benchmark_out="bulk-evidence/$tool-timing.json" > "bulk-evidence/$tool-timing.txt" 2>&1
            "./build-$tool/bin/btree_bulk_memory" > "bulk-evidence/$tool-memory.csv"
            cp "build-$tool/compile_commands.json" "bulk-evidence/$tool-compile-commands.json"
          done
      - name: Focused lifetime and exception sanitizers
        run: |
          clang++ -std=c++20 -O1 -g -DNDEBUG -DWJR_DEBUG_LEVEL=0 -DFMT_HEADER_ONLY \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Iinclude -Ithird-party/fmt/include -I/usr/src/googletest/googletest/include \
            -I/usr/src/googletest/googletest test/container/btree_bulk.cpp \
            /usr/src/googletest/googletest/src/gtest-all.cc \
            /usr/src/googletest/googletest/src/gtest_main.cc -pthread -o bulk-evidence/asan
          ./bulk-evidence/asan > bulk-evidence/asan-tests.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btree-packed-build
          path: bulk-evidence/
          retention-days: 30
