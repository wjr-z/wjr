name: Fused pairwise Linux research

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Bounded research profile
        required: true
        default: np
        type: choice
        options:
          - np

permissions:
  contents: read

concurrency:
  group: np-pairwise-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout fixed probe
        uses: actions/checkout@v5

      - name: GCC and Clang numerical and generated code comparisons
        run: python3 benchmarks/research/pairwise_probe.py

      - name: Upload code generation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: np-pairwise-research-${{ github.sha }}
          path: |
            build/pairwise-research/*.json
            build/pairwise-research/*.txt
            build/pairwise-research/*.log
            build/pairwise-research/*.s
            build/pairwise-research/*.cpp
          retention-days: 30
