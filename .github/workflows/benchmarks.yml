name: Benchmarks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Fixed header dependency
        run: |
          git clone -q --filter=blob:none https://github.com/kokkos/mdspan.git /tmp/mdspan
          git -C /tmp/mdspan checkout -q 0e4eba59ad53451784b3839bdf98b25fa2d64931
      - name: Inspect and compare actual scan API
        shell: bash
        run: |
          git rev-parse HEAD | tee context.txt
          lscpu >> context.txt
          for cxx in g++-13 clang++-18; do
            "$cxx" --version >> context.txt
            flags="-std=c++20 -O3 -ffp-contract=off -march=x86-64 -DWJR_DEBUG_LEVEL=0 -DMDSPAN_USE_PAREN_OPERATOR=1 -DMDSPAN_USE_BRACKET_OPERATOR=0 -Iinclude -I/tmp/mdspan/include"
            echo "$cxx $flags" >> context.txt
            "$cxx" $flags -S -masm=intel benchmarks/research/scan.cpp -o "$cxx.s"
            "$cxx" $flags benchmarks/research/scan.cpp -o "/tmp/$cxx-scan"
            "/tmp/$cxx-scan" | tee "$cxx-results.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: scan-linux
          path: |
            context.txt
            *-results.txt
            *.s
