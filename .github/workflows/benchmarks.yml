name: Benchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btree-copy-reuse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  copy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build nasm libgtest-dev
          git submodule update --init third-party/fmt
          git clone --no-checkout https://github.com/abseil/abseil-cpp.git "$RUNNER_TEMP/copy-absl"
          git -C "$RUNNER_TEMP/copy-absl" checkout 2a2d6aad626f75a32c8b7bb775fbff73d558b8b1
          git fetch --depth=1 origin 035303d5d0e89e3b9416be5510ec9e410d7b6cba
      - name: Same-worker fixed N16 copy assignment
        shell: bash
        run: |
          mkdir copy-evidence
          mkdir -p "$RUNNER_TEMP/copy-reference/wjr/container"
          git show 035303d5d0e89e3b9416be5510ec9e410d7b6cba:include/wjr/container/btree.hpp > "$RUNNER_TEMP/copy-reference/wjr/container/btree.hpp"
          sha256sum "$RUNNER_TEMP/copy-reference/wjr/container/btree.hpp" > copy-evidence/reference-header.sha256
          lscpu > copy-evidence/cpu.txt
          uname -a > copy-evidence/os.txt
          git rev-parse HEAD > copy-evidence/source.txt
          sha256sum include/wjr/container/btree.hpp benchmarks/src/btree_copy.cpp test/container/btree_copy_reuse.cpp > copy-evidence/sources.sha256
          for tool in gcc clang; do
            if [[ "$tool" == gcc ]]; then cc=gcc; cxx=g++; else cc=clang; cxx=clang++; fi
            "$cxx" --version > "copy-evidence/$tool-version.txt"
            cmake -S . -B "build-$tool" -GNinja \
              -DCMAKE_BUILD_TYPE=Release -DWJR_CXX_STANDARD=20 -DWJR_CPU_TARGET=baseline \
              -DWJR_BUILD_BENCHMARKS=ON -DWJR_BENCHMARK_PROFILE=btree \
              -DWJR_BENCHMARK_ABSEIL=ON -DWJR_BENCHMARK_ABSEIL_SOURCE_DIR="$RUNNER_TEMP/copy-absl" \
              -DWJR_COPY_REFERENCE_INCLUDE="$RUNNER_TEMP/copy-reference" \
              -DWJR_BUILD_TESTS=OFF -DWJR_ENABLE_INSTALL=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_COMPILER="$cc" -DCMAKE_CXX_COMPILER="$cxx" \
              -DFETCHCONTENT_BASE_DIR="$RUNNER_TEMP/copy-fetch-$tool"
            cmake --build "build-$tool" --target btree_copy btree_copy_memory btree_copy_reference btree_copy_reference_memory --parallel 4
            "./build-$tool/bin/btree_copy_memory" > "copy-evidence/$tool-candidate-memory.csv"
            "./build-$tool/bin/btree_copy_reference_memory" > "copy-evidence/$tool-reference-memory.csv"
            index=0
            for version in reference candidate candidate reference; do
              if [[ "$version" == reference ]]; then exe="./build-$tool/bin/btree_copy_reference"; else exe="./build-$tool/bin/btree_copy"; fi
              "$exe" --benchmark_filter='/(legacy|compact)/' --benchmark_min_time=0.005s \
                --benchmark_report_aggregates_only=false --benchmark_out="copy-evidence/$tool-$index-$version.json" \
                > "copy-evidence/$tool-$index-$version.txt" 2>&1
              index=$((index+1))
            done
            "./build-$tool/bin/btree_copy" --benchmark_filter='/(std|absl)/' --benchmark_min_time=0.005s \
              --benchmark_report_aggregates_only=false --benchmark_out="copy-evidence/$tool-controls.json" \
              > "copy-evidence/$tool-controls.txt" 2>&1
            cp "build-$tool/compile_commands.json" "copy-evidence/$tool-compile-commands.json"
          done
      - name: Focused copy lifetimes and allocator ownership
        run: |
          clang++ -std=c++20 -O1 -g -DNDEBUG -DWJR_DEBUG_LEVEL=0 -DFMT_HEADER_ONLY \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Iinclude -Ithird-party/fmt/include -I/usr/src/googletest/googletest/include \
            -I/usr/src/googletest/googletest test/container/btree_copy_reuse.cpp \
            test/container/btree_assignment.cpp /usr/src/googletest/googletest/src/gtest-all.cc \
            /usr/src/googletest/googletest/src/gtest_main.cc -pthread -o copy-evidence/asan
          ./copy-evidence/asan > copy-evidence/asan-tests.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btree-copy-reuse
          path: copy-evidence/
          retention-days: 30
