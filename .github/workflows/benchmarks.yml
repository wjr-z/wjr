name: Benchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btree-cursor-abi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  copy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies and exact reference engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build nasm libgtest-dev
          git submodule update --init third-party/fmt
          git fetch --depth=1 origin 7cc9216382f516bb1374e8bc72252650cd9b063e
          mkdir -p "$RUNNER_TEMP/copy-main/wjr/container" "$RUNNER_TEMP/copy-prior/wjr/container"
          git show 7cc9216382f516bb1374e8bc72252650cd9b063e:include/wjr/container/btree.hpp > "$RUNNER_TEMP/copy-prior/wjr/container/btree.hpp"
          python3 -c 'from pathlib import Path; p=Path("${{ runner.temp }}/copy-prior/wjr/container/btree.hpp"); s=p.read_bytes(); a=b"list_node_type *&cursor) noexcept {"; i=s.index(b"std::pair<ikey_type, node_type *> _clone_copy_branch"); j=s.index(a,i); p.write_bytes(s[:j]+s[j:].replace(a,b"list_node_type *cursor) noexcept {",1))'
      - name: GCC read-only marker ABI gate and optional bounded copy
        shell: bash
        run: |
          mkdir copy-evidence
          lscpu > copy-evidence/cpu.txt
          uname -a > copy-evidence/os.txt
          git rev-parse HEAD > copy-evidence/source.txt
          sha256sum include/wjr/container/btree.hpp benchmarks/src/btree_copy.cpp test/container/btree_copy_reuse.cpp "$RUNNER_TEMP/copy-prior/wjr/container/btree.hpp" > copy-evidence/sources.sha256
          for tool in gcc; do
            if [[ "$tool" == gcc ]]; then cc=gcc; cxx=g++; else cc=clang; cxx=clang++; fi
            "$cxx" --version > "copy-evidence/$tool-version.txt"
            for engine in prior candidate; do
              extra=()
              if [[ "$engine" == prior ]]; then extra=(-I"$RUNNER_TEMP/copy-prior"); fi
              "$cxx" -std=c++20 -O3 -DNDEBUG -DWJR_DEBUG_LEVEL=0 -DFMT_HEADER_ONLY -march=x86-64 "${extra[@]}" -Iinclude -Ithird-party/fmt/include -c benchmarks/src/btree_cursor_codegen.cpp -o "copy-evidence/$tool-$engine.o"
              objdump -drC --no-show-raw-insn "copy-evidence/$tool-$engine.o" > "copy-evidence/$tool-$engine-objdump.txt"
            done
            python3 benchmarks/src/btree_cursor_gate.py copy-evidence
            if [[ "$(cat copy-evidence/gcc-gate.txt)" != "GO" ]]; then continue; fi
            cmake -S . -B "build-$tool" -GNinja \
              -DCMAKE_BUILD_TYPE=Release -DWJR_CXX_STANDARD=20 -DWJR_CPU_TARGET=baseline \
              -DWJR_BUILD_BENCHMARKS=ON -DWJR_BENCHMARK_PROFILE=btree -DWJR_BENCHMARK_ABSEIL=OFF \
              -DWJR_COPY_PRIOR_INCLUDE="$RUNNER_TEMP/copy-prior" \
              -DWJR_BUILD_TESTS=OFF -DWJR_ENABLE_INSTALL=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_COMPILER="$cc" -DCMAKE_CXX_COMPILER="$cxx" \
              -DFETCHCONTENT_BASE_DIR="$RUNNER_TEMP/cursor-abi-$tool"
            cmake --build "build-$tool" --target btree_copy btree_copy_memory btree_copy_prior btree_copy_prior_memory --parallel 4
            for version in prior candidate; do
              if [[ "$version" == candidate ]]; then target=btree_copy_memory; else target=btree_copy_${version}_memory; fi
              "./build-$tool/bin/$target" > "copy-evidence/$tool-$version-memory.csv"
            done
            index=0
            for version in prior candidate candidate prior; do
              if [[ "$version" == candidate ]]; then target=btree_copy; else target=btree_copy_${version}; fi
              "./build-$tool/bin/$target" --benchmark_filter='/legacy/' --benchmark_min_time=0.005s \
                --benchmark_report_aggregates_only=false --benchmark_out="copy-evidence/$tool-$index-$version.json" \
                > "copy-evidence/$tool-$index-$version.txt" 2>&1
              index=$((index+1))
            done
            cp "build-$tool/compile_commands.json" "copy-evidence/$tool-compile-commands.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btree-cursor-gcc-control
          path: copy-evidence/
          retention-days: 30
