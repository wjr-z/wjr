name: Benchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btree-rightmost-utilization-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ingest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build nasm libgtest-dev
          git submodule update --init third-party/fmt
          git clone --no-checkout https://github.com/abseil/abseil-cpp.git "$RUNNER_TEMP/ingest-absl"
          git -C "$RUNNER_TEMP/ingest-absl" checkout 2a2d6aad626f75a32c8b7bb775fbff73d558b8b1
          git fetch --depth=1 origin 3be197c1507655c5ee73418c37fcdbb52a991279
      - name: Same-worker reference and candidate
        shell: bash
        run: |
          mkdir ingest-evidence
          lscpu > ingest-evidence/cpu.txt
          uname -a > ingest-evidence/os.txt
          git rev-parse HEAD > ingest-evidence/source.txt
          sha256sum include/wjr/container/btree.hpp benchmarks/src/btree_ingest.cpp benchmarks/src/btree_focused.hpp benchmarks/src/btree_probe_memory.hpp test/container/btree_compact.cpp test/container/btree_allocation.cpp test/container/btree_sorted_insert.cpp > ingest-evidence/sources.sha256
          cp include/wjr/container/btree.hpp "$RUNNER_TEMP/candidate-btree.hpp"
          git show 3be197c1507655c5ee73418c37fcdbb52a991279:include/wjr/container/btree.hpp > "$RUNNER_TEMP/reference-btree.hpp"
          sha256sum "$RUNNER_TEMP/reference-btree.hpp" > ingest-evidence/reference-header.sha256
          for tool in gcc clang; do
            if [[ "$tool" == gcc ]]; then cc=gcc; cxx=g++; else cc=clang; cxx=clang++; fi
            "$cxx" --version > "ingest-evidence/$tool-version.txt"
            cp "$RUNNER_TEMP/reference-btree.hpp" include/wjr/container/btree.hpp
            cmake -S . -B "build-$tool" -GNinja \
              -DCMAKE_BUILD_TYPE=Release -DWJR_CXX_STANDARD=20 -DWJR_CPU_TARGET=baseline \
              -DWJR_BUILD_BENCHMARKS=ON -DWJR_BENCHMARK_PROFILE=btree \
              -DWJR_BENCHMARK_ABSEIL=ON -DWJR_BENCHMARK_ABSEIL_SOURCE_DIR="$RUNNER_TEMP/ingest-absl" \
              -DWJR_BUILD_TESTS=OFF -DWJR_ENABLE_INSTALL=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_COMPILER="$cc" -DCMAKE_CXX_COMPILER="$cxx" \
              -DFETCHCONTENT_BASE_DIR="$RUNNER_TEMP/ingest-fetch-$tool"
            cmake --build "build-$tool" --target btree_ingest btree_ingest_memory --parallel 4
            cp "build-$tool/bin/btree_ingest" "ingest-evidence/$tool-reference"
            "./build-$tool/bin/btree_ingest_memory" > "ingest-evidence/$tool-reference-memory.csv"
            cp "$RUNNER_TEMP/candidate-btree.hpp" include/wjr/container/btree.hpp
            cmake --build "build-$tool" --target btree_ingest btree_ingest_memory --parallel 4
            "./build-$tool/bin/btree_ingest_memory" > "ingest-evidence/$tool-candidate-memory.csv"
            index=0
            for version in reference candidate candidate reference; do
              if [[ "$version" == reference ]]; then exe="./ingest-evidence/$tool-reference"; else exe="./build-$tool/bin/btree_ingest"; fi
              "$exe" --benchmark_filter='^(u64|large)/(sorted|random)/(legacy|compact)/' \
                --benchmark_min_time=0.01s --benchmark_report_aggregates_only=false \
                --benchmark_out="ingest-evidence/$tool-$index-$version.json" > "ingest-evidence/$tool-$index-$version.txt" 2>&1
              index=$((index+1))
            done
            "./build-$tool/bin/btree_ingest" --benchmark_filter='^(u64|large)/(sorted|random)/(std|absl)/' \
              --benchmark_min_time=0.01s --benchmark_report_aggregates_only=false \
              --benchmark_out="ingest-evidence/$tool-controls.json" > "ingest-evidence/$tool-controls.txt" 2>&1
            cp "build-$tool/compile_commands.json" "ingest-evidence/$tool-compile-commands.json"
          done
      - name: Focused typed lifetimes and key separators
        run: |
          clang++ -std=c++20 -O1 -g -DNDEBUG -DWJR_DEBUG_LEVEL=0 -DFMT_HEADER_ONLY \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Iinclude -Ithird-party/fmt/include -I/usr/src/googletest/googletest/include \
            -I/usr/src/googletest/googletest test/container/btree_compact.cpp \
            test/container/btree_allocation.cpp test/container/btree_sorted_insert.cpp \
            /usr/src/googletest/googletest/src/gtest-all.cc \
            /usr/src/googletest/googletest/src/gtest_main.cc -pthread -o ingest-evidence/asan
          ./ingest-evidence/asan > ingest-evidence/asan-tests.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btree-rightmost-utilization
          path: ingest-evidence/
          retention-days: 30
