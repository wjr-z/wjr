name: Vector counted insertion research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-14, clang++-18]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          ref: 9227a90300247bf4eca560918ca23b5f38dd2cec
          submodules: recursive
          path: baseline
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgmp-dev g++-14 clang-18
      - name: Build both sources
        run: |
          cmake -S devtools/vector-insertion -B build-baseline -GNinja \
            -DWJR_SOURCE="$PWD/baseline" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DWJR_CPU_TARGET=native \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-baseline --target modifiers --parallel 3
          cmake -S devtools/vector-insertion -B build-candidate -GNinja \
            -DWJR_SOURCE="$PWD" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DWJR_CPU_TARGET=native \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-candidate --target modifiers --parallel 3
      - name: Correctness and paired measurements
        run: |
          mkdir -p insertion-results
          lscpu > insertion-results/machine.txt
          uname -a >> insertion-results/machine.txt
          ${{ matrix.compiler }} --version >> insertion-results/machine.txt
          git rev-parse HEAD > insertion-results/source.txt
          git -C baseline rev-parse HEAD >> insertion-results/source.txt
          cp build-baseline/compile_commands.json insertion-results/baseline-compile-commands.json
          cp build-candidate/compile_commands.json insertion-results/candidate-compile-commands.json
          size build-baseline/modifiers build-candidate/modifiers > insertion-results/size.txt
          sha256sum include/wjr/container/vector.hpp include/wjr/type_traits.hpp include/wjr/json/document.hpp > insertion-results/production-headers.sha256
          python3 devtools/vector-insertion/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vector-insertion-${{ matrix.compiler }}
          path: insertion-results/
