name: Vector overlap relocation research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-14, clang++-18]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          ref: 9227a90300247bf4eca560918ca23b5f38dd2cec
          submodules: recursive
          path: baseline
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgmp-dev g++-14 clang-18
      - name: Build both sources
        run: |
          cmake -S devtools/overlap-relocation -B build-baseline -GNinja \
            -DWJR_SOURCE="$PWD/baseline" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DWJR_CPU_TARGET=native \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-baseline --target modifiers --parallel 3
          cmake -S devtools/overlap-relocation -B build-candidate -GNinja \
            -DWJR_SOURCE="$PWD" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DWJR_CPU_TARGET=native \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-candidate --target modifiers --parallel 3
          cmake -S devtools/overlap-relocation -B build-loop -GNinja \
            -DWJR_SOURCE="$PWD" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DWJR_CPU_TARGET=native \
            -DELEMENTWISE_ERASE=ON
          cmake --build build-loop --target modifiers --parallel 3
      - name: Correctness and paired measurements
        run: |
          mkdir -p overlap-results
          lscpu > overlap-results/machine.txt
          uname -a >> overlap-results/machine.txt
          ${{ matrix.compiler }} --version >> overlap-results/machine.txt
          git rev-parse HEAD > overlap-results/source.txt
          git -C baseline rev-parse HEAD >> overlap-results/source.txt
          cp build-baseline/compile_commands.json overlap-results/baseline-compile-commands.json
          cp build-candidate/compile_commands.json overlap-results/candidate-compile-commands.json
          size build-baseline/modifiers build-candidate/modifiers > overlap-results/size.txt
          objdump -Cd build-candidate/modifiers > overlap-results/candidate-disassembly.txt
          objdump -Cd build-loop/modifiers > overlap-results/loop-disassembly.txt
          python3 devtools/overlap-relocation/run.py
          GLIBC_TUNABLES=glibc.cpu.hwcaps=-ERMS,-FSRM python3 devtools/overlap-relocation/run.py overlap-results/no-erms
          CANDIDATE_BUILD=loop python3 devtools/overlap-relocation/run.py overlap-results/loop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vector-overlap-${{ matrix.compiler }}
          path: overlap-results/
