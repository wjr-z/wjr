name: Benchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btree-search32-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pool:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build nasm
          git submodule update --init third-party/fmt
      - name: Bounded GCC and Clang measurement
        shell: bash
        run: |
          mkdir search-evidence
          lscpu > search-evidence/cpu.txt
          uname -a > search-evidence/os.txt
          git rev-parse HEAD > search-evidence/source.txt
          sha256sum benchmarks/src/btree_search32_probe.cpp benchmarks/src/btree_focused.hpp include/wjr/container/btree.hpp > search-evidence/sources.sha256
          for tool in gcc clang; do
            if [[ "$tool" == gcc ]]; then cc=gcc; cxx=g++; else cc=clang; cxx=clang++; fi
            "$cxx" --version > "search-evidence/$tool-version.txt"
            cmake -S . -B "build-$tool" -GNinja \
              -DCMAKE_BUILD_TYPE=Release -DWJR_CXX_STANDARD=20 -DWJR_CPU_TARGET=baseline \
              -DWJR_BUILD_BENCHMARKS=ON -DWJR_BENCHMARK_PROFILE=btree \
              \
              -DWJR_BUILD_TESTS=OFF -DWJR_ENABLE_INSTALL=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_COMPILER="$cc" -DCMAKE_CXX_COMPILER="$cxx" \
              -DFETCHCONTENT_BASE_DIR="$RUNNER_TEMP/pool-fetch-$tool"
            cmake --build "build-$tool" --target btree_search32 --parallel 4
            "./build-$tool/bin/btree_search32" --benchmark_min_time=0.03s \
              --benchmark_report_aggregates_only=false --benchmark_out="search-evidence/$tool-timing.json" \
              > "search-evidence/$tool-timing.txt" 2>&1
            cp "build-$tool/compile_commands.json" "search-evidence/$tool-compile-commands.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btree-search32
          path: search-evidence/
          retention-days: 30
