name: Benchmarks

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        default: core
        type: choice
        options:
          - core
          - all
          - simd
          - np

permissions:
  contents: read
  actions: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    env:
      BENCHMARK_PROFILE: ${{ inputs.profile || 'core' }}
      BENCHMARK_SUMMARY_LIMIT: 32
      BENCHMARK_DETAILS_OUTPUT: benchmark-comparison.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Init submodule
        run: git submodule update --init --recursive

      - name: Install benchmark dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev ninja-build

      - name: Cache CMake dependencies
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/wjr-fetchcontent
          key: fetchcontent-${{ runner.os }}-benchmarks-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'benchmarks/**', 'include/**', 'src/**') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-benchmarks-

      - name: Configure
        shell: bash
        run: |
          if [[ "$BENCHMARK_PROFILE" == "all" ]]; then
            gmp=ON
          else
            gmp=OFF
          fi
          xsimd=OFF
          np=OFF
          if [[ "$BENCHMARK_PROFILE" == "simd" ]]; then
            xsimd=ON
          fi
          if [[ "$BENCHMARK_PROFILE" == "np" ]]; then
            np=ON
            xsimd=ON
          fi
          cmake -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DWJR_BUILD_BENCHMARKS=ON \
            -DWJR_BUILD_TESTS=OFF \
            -DWJR_BENCHMARK_PROFILE="$BENCHMARK_PROFILE" \
            -DWJR_BENCHMARK_XSIMD="$xsimd" \
            -DWJR_ENABLE_NP="$np" \
            -DWJR_ENABLE_XSIMD="$np" \
            -DWJR_USE_GMP_TESTS="$gmp" \
            -DFETCHCONTENT_BASE_DIR="$RUNNER_TEMP/wjr-fetchcontent"

      - name: Build benchmarks
        run: cmake --build build --target benchmarks --parallel

      - name: Capture histogram implementation and actual code generation
        run: |
          mkdir -p histogram-codegen
          lscpu > histogram-codegen/lscpu.txt
          python3 - <<'PY'
          import hashlib, json, pathlib, shlex, subprocess
          output = pathlib.Path('histogram-codegen').resolve()
          commands = json.loads(pathlib.Path('build/compile_commands.json').read_text())
          entries = [e for e in commands if pathlib.Path(e['file']).name == 'np_histogram.cpp']
          assert len(entries) == 1
          entry = entries[0]
          (output / 'command.json').write_text(json.dumps(entry, indent=2))
          args = shlex.split(entry['command'])
          stripped = []
          i = 0
          while i < len(args):
              if args[i] == '-o':
                  i += 2
              elif args[i] == '-c':
                  i += 1
              else:
                  stripped.append(args[i])
                  i += 1
          subprocess.run(stripped + ['-S', '-fverbose-asm', '-o', str(output / 'np_histogram.s')], cwd=entry['directory'], check=True)
          with (output / 'object.txt').open('w') as log:
              subprocess.run(['objdump', '-drwC', 'build/benchmarks/CMakeFiles/benchmarks.dir/src/np_histogram.cpp.o'], stdout=log, check=True)
          with (output / 'compiler.txt').open('w') as log:
              subprocess.run([args[0], '--version'], stdout=log, check=True)
          with (output / 'target.txt').open('w') as log:
              subprocess.run([args[0], '-march=native', '-Q', '--help=target'], stdout=log, check=True)
          hashes = {}
          for filename in ['include/wjr/np/histogram.hpp', 'benchmarks/src/np_histogram.cpp']:
              content = pathlib.Path(filename).read_bytes()
              hashes[filename] = hashlib.sha256(content).hexdigest()
              (output / pathlib.Path(filename).name).write_bytes(content)
          hashes['research_head'] = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          hashes['published_head'] = 'a99b70439e798d85bce8de71395b4a3aaa8dfca9'
          (output / 'source-provenance.json').write_text(json.dumps(hashes, indent=2))
          PY

      - name: Run benchmarks
        run: |
          if [[ "$BENCHMARK_PROFILE" == "all" ]]; then
            repetitions=1
            min_time=0.03s
          else
            repetitions=3
            min_time=0.02s
          fi
          ./build/bin/benchmarks \
            --benchmark_format=json \
            --benchmark_out=benchmark-results.json \
            --benchmark_repetitions=7 \
            --benchmark_enable_random_interleaving=true \
            --benchmark_filter=BM_NpHistogram \
            --benchmark_report_aggregates_only=true \
            --benchmark_min_time=0.04s

      - name: Download previous benchmark result
        uses: dawidd6/action-download-artifact@v9
        continue-on-error: true
        with:
          workflow: benchmarks.yml
          workflow_conclusion: success
          branch: main
          name: benchmark-results-${{ env.BENCHMARK_PROFILE }}
          path: baseline
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Add benchmark summary
        shell: bash
        run: |
          baseline_file=$(find baseline -type f -name 'benchmark-results.json' -print -quit 2>/dev/null || true)
          if [[ -n "$baseline_file" ]]; then
            python3 benchmarks/tools/summarize.py \
              benchmark-results.json "$BENCHMARK_PROFILE" "$baseline_file" >> "$GITHUB_STEP_SUMMARY"
          else
            python3 benchmarks/tools/summarize.py \
              benchmark-results.json "$BENCHMARK_PROFILE" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ env.BENCHMARK_PROFILE }}
          path: |
            histogram-codegen/
            benchmark-results.json
            benchmark-comparison.json
          retention-days: 90
