name: JSON direct release comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-14, clang++-18]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgmp-dev libgtest-dev g++-14 clang-18
      - name: Configure release candidate
        run: |
          cmake -S devtools/json-direct-research -B research-build -GNinja \
            -DWJR_SOURCE="$PWD" -DCMAKE_BUILD_TYPE=Release -DWJR_CPU_TARGET=native \
            -DWJR_BUILD_TESTS=OFF -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build release candidate
        run: cmake --build research-build --parallel 3
      - name: Build strict table control
        run: |
          source="$RUNNER_TEMP/wjr-json-strict-table"
          git worktree add --detach "$source" c6b66e6f7ed95b53c882f1b6f74549ffd3ce22f7
          git -C "$source" -c protocol.file.allow=always \
            -c submodule.third-party/fmt.url="$PWD/third-party/fmt" \
            submodule update --init --no-fetch third-party/fmt
          cmake -S devtools/json-direct-research -B table-build -GNinja \
            -DWJR_SOURCE="$source" -DCMAKE_BUILD_TYPE=Release -DWJR_CPU_TARGET=native \
            -DWJR_BUILD_TESTS=OFF -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DFETCHCONTENT_SOURCE_DIR_CPU_FEATURES="$PWD/research-build/_deps/cpu_features-src" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build table-build --target json_direct_timing json_direct_allocations json_direct_tests --parallel 3
      - name: Correctness
        run: |
          ./research-build/json_direct_tests > candidate-tests.txt
          ./table-build/json_direct_tests > table-tests.txt
      - name: Sanitizers
        run: UBSAN_OPTIONS=halt_on_error=1 ASAN_OPTIONS=detect_leaks=1 ./research-build/json_direct_sanitized > sanitizers.txt 2>&1
      - name: Complete-path comparisons
        run: |
          lscpu > machine.txt
          ${{ matrix.compiler }} --version >> machine.txt
          git rev-parse HEAD >> machine.txt
          python3 devtools/json-direct-research/paired.py
          ./research-build/json_direct_allocations > allocations.csv 2> allocation-metadata.txt
          ./table-build/json_direct_allocations > table-allocations.csv 2> table-allocation-metadata.txt
          ./research-build/json_direct_timing corpus > timing.csv 2> timing-metadata.txt
          ./research-build/json_direct_strong_allocations > strong-allocations.csv 2> strong-allocation-metadata.txt
          ./research-build/json_direct_strong_timing > strong-timing.csv 2> strong-timing-metadata.txt
          ./research-build/json_direct_hand > hand-timing.csv 2> hand-timing-metadata.txt
          ./research-build/json_direct_matched_strong > matched-avx2-strong.csv 2> matched-avx2-strong-metadata.txt
          cp research-build/compile_commands.json candidate-compile-commands.json
          cp table-build/compile_commands.json table-compile-commands.json
          sha256sum corpus/*.json > corpus-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: json-direct-${{ matrix.compiler }}
          path: |
            *.txt
            *.csv
            *compile-commands.json
            corpus
