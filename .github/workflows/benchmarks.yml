name: Compare128 operand research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Explicit benchmark dependency
        run: |
          git clone --depth 1 --branch v1.9.0 https://github.com/google/benchmark.git "$RUNNER_TEMP/benchmark-src"
          g++-14 --version
      - name: One Linux GCC14 baseline comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir capture
          lscpu > capture/lscpu.txt
          g++-14 --version > capture/compiler.txt
          git rev-parse HEAD > capture/source-commit.txt
          cmake -S research/compare128 -B "$RUNNER_TEMP/compare128" -GNinja \
            -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-march=x86-64 \
            -DWJR_SOURCE="$GITHUB_WORKSPACE" -DRESEARCH_SOURCE="$GITHUB_WORKSPACE/research/compare128" \
            -DBENCHMARK_SOURCE="$RUNNER_TEMP/benchmark-src" > capture/configure.log 2>&1
          cmake --build "$RUNNER_TEMP/compare128" --target compare_probe -j2 > capture/build.log 2>&1
          "$RUNNER_TEMP/compare128/compare_probe" --benchmark_min_time=0.05s --benchmark_repetitions=7 \
            --benchmark_enable_random_interleaving=true --benchmark_out=capture/linux-gcc14.json \
            --benchmark_out_format=json > capture/run.log 2>&1
          for side in old new; do
            g++-14 -std=c++20 -O3 -march=x86-64 -DWJR_DEBUG_LEVEL=0 \
              -Dwjr=wjr_$side -DWJR_VARIANT=$side -Iresearch/compare128/${side}_include -Iinclude \
              -S -masm=intel research/compare128/bridge.cpp -o "capture/$side.s"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare128-gcc14-baseline
          path: capture/
