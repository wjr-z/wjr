name: NP minmax Linux research

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Bounded research profile
        required: true
        default: np
        type: choice
        options:
          - np

permissions:
  contents: read

concurrency:
  group: np-minmax-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout fixed research source
        uses: actions/checkout@v5

      - name: Compile, validate, and measure installed GCC and Clang
        run: python3 benchmarks/research/run_minmax.py

      - name: Upload raw results and assembly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: np-minmax-linux-${{ github.sha }}
          path: |
            build/minmax-research/*.csv
            build/minmax-research/*.json
            build/minmax-research/*.txt
            build/minmax-research/*.log
            build/minmax-research/*.s
            build/minmax-research/source/**
            build/minmax-research/difference-overlay/**
          retention-days: 30
