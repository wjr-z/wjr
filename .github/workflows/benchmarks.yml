name: JSON immutable complete consumers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-14, clang++-18]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgmp-dev libgtest-dev g++-14 clang-18
      - name: Configure normal WJR modules
        run: |
          cmake -S devtools/json-immutable-research -B research-build -GNinja \
            -DWJR_SOURCE="$PWD" -DCMAKE_BUILD_TYPE=Release -DWJR_CPU_TARGET=native \
            -DWJR_BUILD_TESTS=OFF -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build research-build --parallel 3
      - name: Correctness and sanitizers
        run: |
          UBSAN_OPTIONS=halt_on_error=1 ASAN_OPTIONS=detect_leaks=1 ./research-build/json_immutable_sanitized > sanitizers.txt 2>&1
          ./research-build/json_immutable_tests > tests.txt
      - name: Complete consumers
        run: |
          lscpu > machine.txt
          ${{ matrix.compiler }} --version >> machine.txt
          git rev-parse HEAD >> machine.txt
          git show -s --format=%P HEAD >> machine.txt
          sha256sum include/wjr/json/immutable_document.hpp src/json/immutable_document.cpp \
            src/json/lexer.cpp src/arch/x86/json/lexer.cpp src/json/utf8.cpp \
            include/wjr/format/fastfloat.hpp test/data/success/twitter.json > source-sha256.txt
          ./research-build/json_immutable_allocations test/data/success/twitter.json > allocations.csv 2> allocation-metadata.txt
          ./research-build/json_immutable_timing test/data/success/twitter.json > timing.csv 2> timing-metadata.txt
          cp research-build/compile_commands.json compile-commands.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: json-immutable-${{ matrix.compiler }}
          path: |
            *.txt
            *.csv
            compile-commands.json
