name: Vector tail growth research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-14, clang++-18]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          ref: c69cdbbf370009c8419ea3ef8507d6e48754cbfb
          submodules: recursive
          path: baseline
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgmp-dev g++-14 clang-18
      - name: Build both sources
        run: |
          cmake -S devtools/tail-growth -B build-baseline -GNinja \
            -DWJR_SOURCE="$PWD/baseline" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DWJR_CPU_TARGET=native \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DGROWING_ALLOCATOR=OFF
          cmake --build build-baseline --target tail_timing --parallel 3
          cmake -S devtools/tail-growth -B build-growing -GNinja \
            -DWJR_SOURCE="$PWD" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DWJR_CPU_TARGET=native \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DGROWING_ALLOCATOR=ON
          cmake --build build-growing --target tail_timing --parallel 3
      - name: Correctness and paired measurements
        run: |
          mkdir -p tail-results
          lscpu > tail-results/machine.txt
          uname -a >> tail-results/machine.txt
          ${{ matrix.compiler }} --version >> tail-results/machine.txt
          git rev-parse HEAD > tail-results/source.txt
          git -C baseline rev-parse HEAD >> tail-results/source.txt
          cp build-baseline/compile_commands.json tail-results/baseline-compile-commands.json
          cp build-growing/compile_commands.json tail-results/growing-compile-commands.json
          size build-baseline/tail_timing build-growing/tail_timing > tail-results/size.txt
          python3 devtools/tail-growth/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tail-growth-${{ matrix.compiler }}
          path: tail-results/
