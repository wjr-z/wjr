name: JSON readonly freeze research
on:
  push:
    branches: [research/json-readonly-prototype-20261031]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Record platform
        run: |
          mkdir -p json-readonly-results
          lscpu > json-readonly-results/cpu.txt
          clang++-18 --version > json-readonly-results/compiler.txt
          git rev-parse HEAD > json-readonly-results/source.txt
      - name: Compare and verify private freeze prototype
        run: python3 .github/research/json-readonly-run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: json-readonly-results
          path: json-readonly-results
