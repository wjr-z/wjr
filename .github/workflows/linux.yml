name: Linux
on:
  workflow_dispatch:
jobs:
  lifetime:
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: google/googletest
          ref: 52eb8108c5bdec04579160ae17225d66034bd723
          path: gtest
      - name: Verify allocator hooks and ordinary relocation code generation
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          "$CXX" --version
          base=ebe9a4e90991fc94c766f2acd78483333a1f2317
          git fetch --depth 1 origin "$base"
          old="$RUNNER_TEMP/previous"
          out="$RUNNER_TEMP/allocator-hooks"
          mkdir -p "$old/wjr/memory" "$out"
          git show "$base:include/wjr/memory/uninitialized.hpp" > "$old/wjr/memory/uninitialized.hpp"
          common=(-std=c++20 -DNDEBUG -DWJR_DEBUG_LEVEL=0 -Iinclude -Itest)
          "$CXX" -I"$old" "${common[@]}" -O3 -c .github/scripts/allocator-hooks-probe.cpp -o "$out/old.o"
          "$CXX" "${common[@]}" -O3 -c .github/scripts/allocator-hooks-probe.cpp -o "$out/new.o"
          cmp "$out/old.o" "$out/new.o"
          gtest=(-Igtest/googletest/include -Igtest/googletest)
          "$CXX" "${common[@]}" "${gtest[@]}" -O2 -pthread -c gtest/googletest/src/gtest-all.cc -o "$out/gtest.o"
          "$CXX" "${common[@]}" "${gtest[@]}" -O2 -pthread -c gtest/googletest/src/gtest_main.cc -o "$out/gtest-main.o"
          sources=(test/memory/{uninitialized,uninitialized_rollback,relocate_allocator,allocator_lifecycle_traits,lifetime_storage,construction_rollback,common_relocate,construct_at_cv,temporary_value_allocator}.cpp src/memory/stack_allocator.cpp)
          "$CXX" "${common[@]}" "${gtest[@]}" -O1 -g -pthread \
            -fsanitize=address,undefined -fno-sanitize-recover=all "${sources[@]}" \
            "$out/gtest.o" "$out/gtest-main.o" -o "$out/tests"
          "$out/tests" --gtest_brief=1
          if "$CXX" -I"$old" "${common[@]}" "${gtest[@]}" -fsyntax-only test/memory/allocator_lifecycle_traits.cpp > "$out/red.log" 2>&1; then
            echo "Expected the original exception trait assertions to fail."
            exit 1
          fi
          grep -m 4 'static assertion failed' "$out/red.log"
