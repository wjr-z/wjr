name: Biginteger output evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned fmt
        run: git submodule update --init third-party/fmt
      - name: Same-host conversion checks and costs
        run: python3 research/biginteger-output/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biginteger-output-evidence
          path: research-output
