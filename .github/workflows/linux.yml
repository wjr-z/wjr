name: Linux
on:
  workflow_dispatch:
jobs:
  set:
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: google/googletest
          ref: 52eb8108c5bdec04579160ae17225d66034bd723
          path: gtest
      - uses: actions/checkout@v5
        with:
          repository: google/cpu_features
          ref: d3b2440fcfc25fe8e6d0d4a85f06d68e98312f5b
          path: cpu-features
      - name: Test SIMD fill boundaries and code generation
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          "$CXX" --version
          base=ebe9a4e90991fc94c766f2acd78483333a1f2317
          git fetch --depth 1 origin "$base"
          old="$RUNNER_TEMP/previous"
          out="$RUNNER_TEMP/set"
          mkdir -p "$old/wjr/math" "$old/wjr/arch/x86/math" "$out"
          for hdr in wjr/math/set.hpp wjr/arch/x86/math/set.hpp; do
            git show "$base:include/$hdr" > "$old/$hdr"
          done
          cmake -S cpu-features -B "$out/cpu" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build "$out/cpu" --target cpu_features
          lib="$out/cpu/libcpu_features.a"
          test -f "$lib"
          common=(-std=c++20 -DNDEBUG -DWJR_DEBUG_LEVEL=0 -Iinclude -Icpu-features/include)
          gtest=(-Igtest/googletest/include -Igtest/googletest)
          "$CXX" "${common[@]}" "${gtest[@]}" -O2 -pthread -c gtest/googletest/src/gtest-all.cc -o "$out/gtest.o"
          "$CXX" "${common[@]}" "${gtest[@]}" -O2 -pthread -c gtest/googletest/src/gtest_main.cc -o "$out/gtest-main.o"
          sources=(test/math/set.cpp src/arch/x86/math/set.cpp src/arch/x86/cpuinfo.cpp)
          for arch in -msse2 -mavx2; do
            echo "Testing $arch"
            "$CXX" -I"$old" "${common[@]}" "$arch" -O3 -c .github/scripts/set-probe.cpp -o "$out/old.o"
            "$CXX" "${common[@]}" "$arch" -O3 -c .github/scripts/set-probe.cpp -o "$out/new.o"
            if ! cmp "$out/old.o" "$out/new.o"; then
              for object in old new; do
                objdump -dr "$out/$object.o" | tail -n +3 > "$out/$object.asm"
              done
              diff -u "$out/old.asm" "$out/new.asm"
            fi
            "$CXX" "${common[@]}" "${gtest[@]}" "$arch" -O1 -g -pthread \
              -fsanitize=address,undefined -fno-sanitize-recover=all "${sources[@]}" \
              "$out/gtest.o" "$out/gtest-main.o" "$lib" -o "$out/tests"
            "$out/tests" --gtest_brief=1
          done
          if "$CXX" -I"$old" "${common[@]}" "${gtest[@]}" -mavx2 -O2 -pthread \
              "${sources[@]}" "$out/gtest.o" "$out/gtest-main.o" "$lib" -o "$out/old-tests" > "$out/red.log" 2>&1; then
            echo "Expected the old headers to reject the noncanonical unsigned long type."
            exit 1
          fi
          grep -m 4 -E 'set1|undefined reference.*large_builtin_set_n' "$out/red.log"
