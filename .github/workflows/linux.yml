name: Checked bigint parser evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang++-18, g++-13]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Pinned fmt source and build tools
        run: |
          git submodule update --init third-party/fmt
          sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Checked bounds, unchecked codegen and same-process controls
        run: python3 research/checked-parse/run.py '${{ matrix.compiler }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checked-parser-${{ matrix.compiler }}
          path: research-output
