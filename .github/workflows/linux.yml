name: Mimalloc adapter evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/mimalloc
          ref: 56dc5eb80145f9a3ba7ca23d47c6a248b9d8586c
          path: _provider
      - name: Initialize the pinned formatting dependency
        run: git submodule update --init third-party/fmt
      - name: Validate adapters and compare existing resources
        run: python3 research_mimalloc.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mimalloc-adapter-evidence
          path: |
            evidence/*.json
            evidence/*.csv
            evidence/*.log
            research_mimalloc.py
            mimalloc_study.cpp
