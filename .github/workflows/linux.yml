name: Linux
on:
  workflow_dispatch:
jobs:
  shift:
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: google/googletest
          ref: 52eb8108c5bdec04579160ae17225d66034bd723
          path: gtest
      - name: Check limb shift overlap and code generation
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          "$CXX" --version
          base=ebe9a4e90991fc94c766f2acd78483333a1f2317
          git fetch --depth 1 origin "$base"
          old="$RUNNER_TEMP/previous"
          out="$RUNNER_TEMP/shift"
          mkdir -p "$old/wjr/math" "$out"
          git show "$base:include/wjr/math/shift.hpp" > "$old/wjr/math/shift.hpp"
          common=(-std=c++20 -DNDEBUG -DWJR_DEBUG_LEVEL=0 -Iinclude)
          gtest=(-Igtest/googletest/include -Igtest/googletest)
          "$CXX" "${common[@]}" "${gtest[@]}" -O2 -pthread -c gtest/googletest/src/gtest-all.cc -o "$out/gtest.o"
          "$CXX" "${common[@]}" "${gtest[@]}" -O2 -pthread -c gtest/googletest/src/gtest_main.cc -o "$out/gtest-main.o"
          sources=(test/math/shift.cpp src/arch/x86/math/shift.cpp)
          for arch in -msse2 -mavx2; do
            echo "Testing $arch"
            "$CXX" "${common[@]}" "${gtest[@]}" "$arch" -O1 -g -pthread \
              -fsanitize=address,undefined -fno-sanitize-recover=all "${sources[@]}" \
              "$out/gtest.o" "$out/gtest-main.o" -o "$out/tests"
            "$out/tests" --gtest_brief=1
            "$CXX" -I"$old" "${common[@]}" "$arch" -O3 -c .github/scripts/shift-probe.cpp -o "$out/old.o"
            "$CXX" "${common[@]}" "$arch" -O3 -c .github/scripts/shift-probe.cpp -o "$out/new.o"
            if ! cmp "$out/old.o" "$out/new.o"; then
              for object in old new; do
                objdump -dr "$out/$object.o" | tail -n +3 > "$out/$object.asm"
              done
              diff -u "$out/old.asm" "$out/new.asm"
            fi
          done
          if "$CXX" -I"$old" "${common[@]}" "${gtest[@]}" -mavx2 -O2 -pthread \
              "${sources[@]}" "$out/gtest.o" "$out/gtest-main.o" -o "$out/old-tests" > "$out/red.log" 2>&1; then
            echo "Expected the old headers to link an uninstantiated unsigned long long kernel."
            exit 1
          fi
          grep -m 4 -E 'undefined reference.*large_builtin_.*shift_n' "$out/red.log"
