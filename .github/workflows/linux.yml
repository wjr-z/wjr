name: Stack domain research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Fetch pinned fmt headers
        run: git submodule update --init third-party/fmt
      - name: Validate modules and same-host controls
        run: python3 research_stack.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-domain-evidence
          path: research-output
