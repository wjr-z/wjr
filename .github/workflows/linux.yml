name: Biginteger benchmark contract evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Pinned sources and GMP
        run: |
          git submodule update --init third-party/fmt
          sudo apt-get update && sudo apt-get install -y libgmp-dev ninja-build
          git clone --depth 1 --branch v1.9.0 https://github.com/google/benchmark.git "$RUNNER_TEMP/benchmark-src"
      - name: Build all-profile benchmarks and instrumented conversion contracts
        run: python3 research/conversion-contracts/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biginteger-benchmark-contracts
          path: research-output
