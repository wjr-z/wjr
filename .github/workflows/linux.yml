# This is a basic workflow to help you get started with Actions

name: Linux

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "AGENTS.md"
      - ".gitignore"
      - ".editorconfig"
      - ".gitattributes"
      - ".clang-format"
      - ".pre-commit-config.yaml"
      - ".github/workflows/pre-commit.yml"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "AGENTS.md"
      - ".gitignore"
      - ".editorconfig"
      - ".gitattributes"
      - ".clang-format"
      - ".pre-commit-config.yaml"
      - ".github/workflows/pre-commit.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  tests:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04
    name: ${{ matrix.sys.compiler }} ${{ matrix.sys.version }} C++${{ matrix.sys.standard }} ${{ matrix.sys.cpu }}
    env:
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        sys:
        - {compiler: clang, version: '17', standard: '20', cpu: native}
        - {compiler: clang, version: '18', standard: '20', cpu: native}
        - {compiler: clang, version: '19', standard: '20', cpu: native}
        - {compiler: clang, version: '20', standard: '20', cpu: native}
        - {compiler: gcc, version: '11', standard: '20', cpu: baseline}
        - {compiler: gcc, version: '11', standard: '20', cpu: native}
        - {compiler: gcc, version: '12', standard: '20', cpu: native}
        - {compiler: gcc, version: '13', standard: '20', cpu: native}
        - {compiler: gcc, version: '14', standard: '20', cpu: native}
        - {compiler: gcc, version: '14', standard: '23', cpu: baseline}
        - {compiler: clang, version: '20', standard: '23', cpu: baseline}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Install GCC
        if: matrix.sys.compiler == 'gcc'
        uses: egor-tensin/setup-gcc@v1
        with:
          version: ${{matrix.sys.version}}
          platform: x64

      - name: Install LLVM and Clang
        if: matrix.sys.compiler == 'clang'
        uses: egor-tensin/setup-clang@v1
        with:
          version: ${{matrix.sys.version}}
          platform: x64

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Init submodule
        run: git submodule update --init --recursive

      - name: Cache CMake dependencies
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/wjr-fetchcontent
          key: fetchcontent-${{ runner.os }}-${{ matrix.sys.compiler }}-${{ matrix.sys.version }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**/CMakeLists.txt', 'test/CMakeLists.txt', 'benchmarks/CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-${{ matrix.sys.compiler }}-${{ matrix.sys.version }}-

      - name: Install GMP
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev

      - name: Identify compilers and native target
        id: compiler
        run: |
          if [[ "${{matrix.sys.compiler}}" = "gcc" ]]; then CC=gcc-${{matrix.sys.version}}; CXX=g++-${{matrix.sys.version}}; else CC=clang; CXX=clang++; fi
          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/wjr-ccache" >> "$GITHUB_ENV"
          fingerprint_file="$RUNNER_TEMP/wjr-compiler-fingerprint.json"
          echo "WJR_CCACHE_NATIVE_FINGERPRINT=$fingerprint_file" >> "$GITHUB_ENV"
          . /etc/os-release
          echo "os=${ImageOS:-unknown}-${ID:?}-${VERSION_ID:?}" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/compiler_fingerprint.py \
            --family "${{matrix.sys.compiler}}" --cc "$CC" --cxx "$CXX" \
            --output "$fingerprint_file" >> "$GITHUB_OUTPUT"

      - name: Cache compiled objects
        # v1.2.24: restore/save, bounded storage and statistics are owned by the action.
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d
        with:
          key: linux-v3-${{ steps.compiler.outputs.os }}-${{ runner.arch }}-${{ matrix.sys.compiler }}-${{ matrix.sys.version }}-cxx${{ matrix.sys.standard }}-${{ matrix.sys.cpu }}-${{ steps.compiler.outputs.toolchain }}
          # No broader restore-keys. Native objects are isolated by the launcher;
          # baseline objects can share this pool across different runner CPUs.
          max-size: 500MB

      - name: Validate compiler fingerprint guards
        if: matrix.sys.compiler == 'clang' && matrix.sys.version == '20' && matrix.sys.standard == '20'
        run: |
          python3 .github/scripts/test_compiler_fingerprint.py
          python3 .github/scripts/test_sccache_launcher.py

      - name: Configure using CMake
        run: |
          benchmark_args=()
          if [[ "${{matrix.sys.compiler}}" == "clang" && "${{matrix.sys.version}}" == "20" || "${{matrix.sys.compiler}}" == "gcc" && "${{matrix.sys.version}}" == "11" ]]; then
            benchmark_args+=(-DWJR_ENABLE_NP=ON)
          fi
          if [[ "${{matrix.sys.compiler}}" == "clang" && "${{matrix.sys.version}}" == "20" && "${{matrix.sys.standard}}" == "20" ]]; then
            benchmark_args+=(-DWJR_BUILD_BENCHMARKS=ON -DWJR_BENCHMARK_PROFILE=simd -DWJR_BENCHMARK_XSIMD=ON -DWJR_ENABLE_XSIMD=ON)
          fi
          cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DWJR_BUILD_TESTS=ON \
            -DWJR_DEBUG_LEVEL_RELEASE=3 -DWJR_ENABLE_ASAN=ON \
            -DWJR_CXX_STANDARD=${{matrix.sys.standard}} -DWJR_CPU_TARGET=${{matrix.sys.cpu}} \
            -DFETCHCONTENT_BASE_DIR="$RUNNER_TEMP/wjr-fetchcontent" \
            -DCMAKE_C_COMPILER_LAUNCHER="python3;$GITHUB_WORKSPACE/.github/scripts/ccache_launcher.py" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="python3;$GITHUB_WORKSPACE/.github/scripts/ccache_launcher.py" \
            -DCMAKE_C_COMPILER=$CC -DCMAKE_CXX_COMPILER=$CXX "${benchmark_args[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan_suppressions.txt
        run: ctest --test-dir build --verbose --output-on-failure

      - name: Validate installed package
        if: matrix.sys.compiler == 'clang' && matrix.sys.version == '20' && matrix.sys.standard == '20'
        env:
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan_suppressions.txt
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/wjr-install"
          cmake -S test/consumer -B consumer-build -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER="python3;$GITHUB_WORKSPACE/.github/scripts/ccache_launcher.py" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/wjr-install" -DWJR_EXPECT_CXX_STANDARD=20 \
            -DWJR_TEST_NP=ON -DWJR_TEST_SIMD_XSIMD=ON
          cmake --build consumer-build --parallel
          ctest --test-dir consumer-build --output-on-failure

      - name: Validate SIMD benchmark backends
        if: matrix.sys.compiler == 'clang' && matrix.sys.version == '20' && matrix.sys.standard == '20'
        env:
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan_suppressions.txt
        run: >-
          ./build/bin/benchmarks
          --benchmark_filter='((fill/(wjr|loop|xsimd)/u(16|32|64)/(value|zero)/n:(4|8|300)|mixed_fill/(wjr|loop|xsimd)/u64/(value|zero)/workload:1)/offset:1|scan/(wjr|loop|xsimd)/u64/n:(4|8|300)/offset:1/hit:(0|3)|mixed_scan/(wjr|loop|xsimd)/u64)/real_time$'
          --benchmark_min_time=0.001s
