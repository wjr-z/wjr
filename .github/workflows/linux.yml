name: GoogleTest shard evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - {family: clang, version: '18'}
          - {family: gcc, version: '13'}
    steps:
      - uses: actions/checkout@v5
      - name: Pinned submodules and runtime tools
        run: |
          git submodule update --init --recursive
          sudo apt-get update && sudo apt-get install -y libgmp-dev nasm ninja-build
      - name: Cache CMake dependency sources
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/wjr-fetchcontent
          key: fetchcontent-${{ runner.os }}-${{ matrix.compiler.family }}-${{ matrix.compiler.version }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**/CMakeLists.txt', 'test/CMakeLists.txt', 'benchmarks/CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-${{ matrix.compiler.family }}-${{ matrix.compiler.version }}-
      - name: Identify exact compiler and native target
        id: compiler
        env:
          FAMILY: ${{ matrix.compiler.family }}
          VERSION: ${{ matrix.compiler.version }}
        run: |
          if [[ "$FAMILY" == clang ]]; then
            sudo ln -sfn "$(command -v clang-$VERSION)" /usr/local/bin/clang
            sudo ln -sfn "$(command -v clang++-$VERSION)" /usr/local/bin/clang++
            CC=/usr/local/bin/clang; CXX=/usr/local/bin/clang++
          else
            CC=gcc-$VERSION; CXX=g++-$VERSION
          fi
          for driver in "$CC" "$CXX"; do
            "$driver" --version
            actual=$("$driver" -dumpversion)
            [[ "${actual%%.*}" == "$VERSION" ]]
          done
          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/wjr-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          fingerprint_file="$RUNNER_TEMP/wjr-compiler-fingerprint.json"
          echo "WJR_CCACHE_NATIVE_FINGERPRINT=$fingerprint_file" >> "$GITHUB_ENV"
          . /etc/os-release
          echo "os=${ImageOS:-unknown}-${ID:?}-${VERSION_ID:?}" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/compiler_fingerprint.py --family "$FAMILY" --cc "$CC" --cxx "$CXX" --output "$fingerprint_file" >> "$GITHUB_OUTPUT"
      - name: Reuse validated compiler object cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d
        with:
          key: linux-v3-${{ steps.compiler.outputs.os }}-${{ runner.arch }}-${{ matrix.compiler.family }}-${{ matrix.compiler.version }}-cxx20-native-${{ steps.compiler.outputs.toolchain }}
          max-size: 500MB
      - name: One build and interleaved complete-suite controls
        run: python3 research/gtest-shards/run.py "$CXX"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtest-shards-${{ matrix.compiler.family }}
          path: research-output
