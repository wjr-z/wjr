name: Pre-commit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Get Python version
        id: python-version
        shell: bash
        run: echo "version=$(python -VV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ runner.os }}|${{ steps.python-version.outputs.version }}|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit|${{ runner.os }}|${{ steps.python-version.outputs.version }}|

      - name: Run pre-commit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python -m pre_commit run --show-diff-on-failure --color=always \
              --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "$zero_sha" ]]; then
            python -m pre_commit run --show-diff-on-failure --color=always \
              --from-ref "$BEFORE_SHA" --to-ref "$COMMIT_SHA"
          else
            python -m pre_commit run --show-diff-on-failure --color=always --all-files
          fi
