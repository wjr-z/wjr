name: Pre-commit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select GitHub Actions workflows
        id: workflows
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          selected="$RUNNER_TEMP/wjr-workflow-files"
          paths=('.github/workflows/*.yml' '.github/workflows/*.yaml')
          zero_sha=0000000000000000000000000000000000000000
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --no-renames --diff-filter=ACMT --name-only -z \
              "$BASE_SHA" "$HEAD_SHA" -- "${paths[@]}" > "$selected"
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "$zero_sha" ]]; then
            git diff --no-renames --diff-filter=ACMT --name-only -z \
              "$BEFORE_SHA" "$COMMIT_SHA" -- "${paths[@]}" > "$selected"
          else
            git ls-files -z -- "${paths[@]}" > "$selected"
          fi
          if [[ -s "$selected" ]]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check GitHub Actions workflows
        if: steps.workflows.outputs.any == 'true'
        shell: bash
        env:
          SHELLCHECK_OPTS: --severity=warning
        run: |
          shellcheck --version
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          mapfile -d '' -t workflows < "$RUNNER_TEMP/wjr-workflow-files"
          "$RUNNER_TEMP/actionlint" -color -shellcheck shellcheck -pyflakes="" "${workflows[@]}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Get Python version
        id: python-version
        shell: bash
        run: echo "version=$(python -VV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ runner.os }}|${{ steps.python-version.outputs.version }}|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit|${{ runner.os }}|${{ steps.python-version.outputs.version }}|

      - name: Run pre-commit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python -m pre_commit run --show-diff-on-failure --color=always \
              --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "$zero_sha" ]]; then
            python -m pre_commit run --show-diff-on-failure --color=always \
              --from-ref "$BEFORE_SHA" --to-ref "$COMMIT_SHA"
          else
            python -m pre_commit run --show-diff-on-failure --color=always --all-files
          fi
