name: Btree hint measurement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Cache dependency sources
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/hint-fetch-gcc
            ${{ runner.temp }}/hint-fetch-clang
          key: btree-hint-deps-${{ runner.os }}-v1
      - name: Measure both compilers on this worker
        shell: bash
        run: |
          mkdir -p hint-results
          lscpu > hint-results/cpu.txt
          uname -a > hint-results/os.txt
          git rev-parse HEAD > hint-results/source.txt
          printf '%s\n' '5b22bdf111915172d0ef0ec319d18bdd5135cdd4' > hint-results/feature-source.txt
          git diff --exit-code 5b22bdf111915172d0ef0ec319d18bdd5135cdd4 -- include benchmarks test
          for family in gcc clang; do
            if [[ "$family" == gcc ]]; then cxx=g++; cc=gcc; else cxx=clang++; cc=clang; fi
            "$cxx" --version > "hint-results/$family-version.txt"
            cmake -S . -B "build-$family" -GNinja \
              -DCMAKE_C_COMPILER="$cc" -DCMAKE_CXX_COMPILER="$cxx" \
              -DCMAKE_BUILD_TYPE=Release -DWJR_CXX_STANDARD=20 -DWJR_CPU_TARGET=baseline \
              -DWJR_BUILD_TESTS=OFF -DWJR_BUILD_BENCHMARKS=ON -DWJR_BENCHMARK_PROFILE=btree \
              -DWJR_ENABLE_INSTALL=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DFETCHCONTENT_BASE_DIR="$RUNNER_TEMP/hint-fetch-$family"
            cmake --build "build-$family" --target btree_hint --parallel 4
            "./build-$family/bin/btree_hint" --benchmark_min_time=0.03s \
              --benchmark_repetitions=5 --benchmark_report_aggregates_only=false \
              --benchmark_out="hint-results/$family-timing.json"
            cp "build-$family/compile_commands.json" "hint-results/$family-compile-commands.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btree-hints
          path: hint-results/
          retention-days: 90
