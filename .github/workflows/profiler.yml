name: Offline profiler

on:
  push:
    branches: [main]
    paths:
      - "devtools/profiler/**"
      - ".github/workflows/profiler.yml"
  pull_request:
    branches: [main]
    paths:
      - "devtools/profiler/**"
      - ".github/workflows/profiler.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdlib-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Offline fixtures, CLI and compatibility checks
        run: python -m unittest discover -s devtools/profiler/tests -v
