# This is a basic workflow to help you get started with Actions

name: Windows

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "AGENTS.md"
      - ".gitignore"
      - ".editorconfig"
      - ".gitattributes"
      - ".clang-format"
      - ".pre-commit-config.yaml"
      - ".github/workflows/pre-commit.yml"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "AGENTS.md"
      - ".gitignore"
      - ".editorconfig"
      - ".gitattributes"
      - ".clang-format"
      - ".pre-commit-config.yaml"
      - ".github/workflows/pre-commit.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Preserve separate PRs, main pushes and manual validation runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  tests:
    # The type of runner that the job will run on
    runs-on: windows-latest
    name: ${{ matrix.sys.compiler }} C++${{ matrix.sys.standard }} ${{ matrix.sys.cpu }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: wjr-windows-v1
    strategy:
      fail-fast: false
      matrix:
        sys:
        - {compiler: msvc, standard: '20', cpu: baseline}
        - {compiler: clang, standard: '20', cpu: native}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Setup MSVC
        if: matrix.sys.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup clang
        if: matrix.sys.compiler == 'clang'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          env: true

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Init submodule
        run: git submodule update --init --recursive

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

    #   - name: Install GMP

      - name: Cache CMake dependencies
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/wjr-fetchcontent
          key: fetchcontent-${{ runner.os }}-${{ matrix.sys.compiler }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**/CMakeLists.txt', 'test/CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-${{ matrix.sys.compiler }}-

      - name: Cache compiled objects
        # v0.0.9; official prebuilt backend supports MSVC and Clang's GNU driver.
        uses: Mozilla-Actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
        with:
          version: v0.18.0

      - name: Identify native compiler target
        if: matrix.sys.compiler == 'clang'
        shell: bash
        run: |
          fingerprint_file="$RUNNER_TEMP/wjr-compiler-fingerprint.json"
          echo "WJR_CCACHE_NATIVE_FINGERPRINT=$fingerprint_file" >> "$GITHUB_ENV"
          python .github/scripts/compiler_fingerprint.py --family clang \
            --cc clang --cxx clang++ --output "$fingerprint_file"

      - name: Configure using CMake
        shell: bash
        run: |
          cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DWJR_BUILD_TESTS=ON \
            -DWJR_DEBUG_LEVEL_RELEASE=3 -DWJR_USE_GMP_TESTS=OFF \
            -DWJR_CXX_STANDARD=${{matrix.sys.standard}} -DWJR_CPU_TARGET=${{matrix.sys.cpu}} \
            -DFETCHCONTENT_BASE_DIR="$RUNNER_TEMP/wjr-fetchcontent" \
            -DCMAKE_C_COMPILER_LAUNCHER="python;$GITHUB_WORKSPACE/.github/scripts/sccache_launcher.py" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="python;$GITHUB_WORKSPACE/.github/scripts/sccache_launcher.py"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build --parallel 2 --verbose --output-on-failure