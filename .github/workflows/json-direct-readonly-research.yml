name: JSON direct readonly research
on:
  push:
    branches: [research/json-direct-readonly]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Record platform
        run: |
          mkdir -p json-direct-readonly-results
          lscpu > json-direct-readonly-results/cpu.txt
          clang++-18 --version > json-direct-readonly-results/compiler.txt
          git rev-parse HEAD > json-direct-readonly-results/source.txt
      - name: Verify and compare private direct parser
        run: python3 .github/research/json-direct-readonly-run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: json-direct-readonly-results
          path: json-direct-readonly-results
