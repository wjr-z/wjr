repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        args: [--dry-run, --Werror, --style=file]
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
        # The demo carries upstream simdjson amalgamations; do not reformat them.
        exclude: ^(?:(?:third-party|build(?:_[^/]*)?)/|examples/demo/src/simdjson\.(?:cpp|hpp)$)
